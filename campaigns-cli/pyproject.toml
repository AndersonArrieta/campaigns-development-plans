[project]
name = "campaigns-cli"
version = "0.1.0"
description = "CLI de pruebas sobre los recursos AWS del flujo de campañas"
readme = "README.md"
authors = [
    { name = "AndersonArrieta", email = "anderson.arrieta@finaipro.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.112",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
campaigns = "campaigns_cli.main:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,eks,lambda,logs,s3,sts]>=1.43.112",
    "moto[dynamodb,logs,s3]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["campaigns_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
